services:

  backend1:
    container_name: nestjs_backend
    build: ./backend/business-logic/
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
      FASTAPI_URL: 'test'
      INTERNAL_API_KEY: 'test'
      REDIS_PORT: "${REDIS_PORT:?REDIS_PORT is required}"
    secrets:
      - suf_user
      - suf_password
      - redis_password

  fastapi-backend:
    container_name: fastapiBackend
    build: ./backend/fastAPI-backend/
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
      REDIS_PORT: "${REDIS_PORT:?REDIS_PORT is required}"
    secrets:
      - suf_user
      - suf_password
      - redis_password


  nginx:
    container_name: nginx
    build: ./devops/nginx/
    environment:
      NGINX_STUB_STATUS_SCHEME: "${NGINX_STUB_STATUS_SCHEME:?NGINX_STUB_STATUS_SCHEME IS REQUIRED}"
      NGINX_ADDR: "${NGINX_ADDR:?NGINX_ADDR IS REQUIRED}"
      NGINX_STUB_STATUS_PORT: "${NGINX_STUB_STATUS_PORT:?NGINX_STUB_STATUS_PORT IS REQUIRED}"
      NGINX_STUB_STATUS: "${NGINX_STUB_STATUS:?NGINX_STUB_STATUS IS REQUIRED}"
      NGINX_PORT: ${NGINX_PORT:?NGINX_PORT IS REQUIRED}
    volumes:
      - ./devops/nginx/templates/:/etc/nginx/templates/:ro
      - ./devops/nginx/docker-entrypoint.d/setup_ssl.sh/:/docker-entrypoint.d/setup_ssl.sh:ro
    ports:
      - ${NGINX_STUB_STATUS_PORT}:${NGINX_STUB_STATUS_PORT}
      - ${NGINX_PORT}:${NGINX_PORT}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  postgresql:
    container_name: postgresql
    build: ./database/postgresql/
    command: postgres -p "$POSTGRES_PORT"
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_PASSWORD_FILE: "${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD is required}"
      POSTGRES_USER_FILE: "${POSTGRES_USER_FILE:?POSTGRES_USER_FILE is required}"
      DEVELOPMENT: ''
    ports:
      - $POSTGRES_PORT:$POSTGRES_PORT
    secrets:
      - postgres_password
      - postgres_user
      - suf_user
      - suf_password
    volumes:
      - ./database/postgresql/docker-entrypoint.d:/docker-entrypoint-initdb.d/:ro
      # - db_data:$PGDATA
    healthcheck:
      test: ["CMD", "/usr/local/bin/psql_healthcheck.sh"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  # in memory database
  # because it does not support env or secrets
  # i have used shell to get secret password and REDIS_PORT env
  redis:
    container_name: redis
    build: ./devops/redis/
    # ports:
    #   - ${REDIS_PORT}:${REDIS_PORT}
    environment:
      - REDIS_PORT
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
    secrets:
      - redis_password

secrets:
  postgres_password:
    file: ./secrets/postgresql/postgres_password
  postgres_user:
    file: ./secrets/postgresql/postgres_user
  suf_user:
    file: ./secrets/postgresql/suf/suf_user
  suf_password:
    file: ./secrets/postgresql/suf/suf_password
  redis_password:
    file: ./secrets/redis/redis_password

volumes:
  db_data:
    driver: local
    driver_opts:
      device: /tmp/dir
