services:

  nestjs_backend:
    container_name: nestjsBackend
    build: ./backend/business-logic/
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
      mail_server:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
      FASTAPI_URL: 'test'
      INTERNAL_API_KEY: 'test'
      REDIS_PORT: "${REDIS_PORT:?REDIS_PORT is required}"
      SMTP_HOST: "mail_server" 
      SMTP_PORT: "${SMTP_PORT}" 
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_FROM: "${SMTP_FROM}" 
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      NESTJS_PORT: "${NESTJS_PORT}"
      NEST_URL: "${NEST_URL}"
    secrets:
      - suf_user
      - suf_password
      - redis_password
    ports:
      - "${NESTJS_PORT}:${NESTJS_PORT}"

  fastapi-backend:
    container_name: fastapiBackend
    build: ./backend/fastAPI-backend/
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
      REDIS_PORT: "${REDIS_PORT:?REDIS_PORT is required}"
    secrets:
      - suf_user
      - suf_password
      - redis_password


  nginx:
    container_name: nginx
    build: ./devops/nginx/
    environment:
      NGINX_STUB_STATUS_SCHEME: "${NGINX_STUB_STATUS_SCHEME:?NGINX_STUB_STATUS_SCHEME IS REQUIRED}"
      NGINX_ADDR: "${NGINX_ADDR:?NGINX_ADDR IS REQUIRED}"
      NGINX_STUB_STATUS_PORT: "${NGINX_STUB_STATUS_PORT:?NGINX_STUB_STATUS_PORT IS REQUIRED}"
      NGINX_STUB_STATUS: "${NGINX_STUB_STATUS:?NGINX_STUB_STATUS IS REQUIRED}"
      NGINX_PORT: ${NGINX_PORT:?NGINX_PORT IS REQUIRED}
    volumes:
      - ./devops/nginx/templates/:/etc/nginx/templates/:ro
      - ./devops/nginx/docker-entrypoint.d/setup_ssl.sh/:/docker-entrypoint.d/setup_ssl.sh:ro
    ports:
      - ${NGINX_STUB_STATUS_PORT}:${NGINX_STUB_STATUS_PORT}
      - ${NGINX_PORT}:${NGINX_PORT}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  postgresql:
    container_name: postgresql
    build: ./database/postgresql/
    command: postgres -p "$POSTGRES_PORT"
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_PASSWORD_FILE: "${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD is required}"
      POSTGRES_USER_FILE: "${POSTGRES_USER_FILE:?POSTGRES_USER_FILE is required}"
      DEVELOPMENT: ''
    ports:
      - $POSTGRES_PORT:$POSTGRES_PORT
    secrets:
      - postgres_password
      - postgres_user
      - suf_user
      - suf_password
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - ./database/postgresql/docker-entrypoint.d:/docker-entrypoint-initdb.d/:ro
      # - db_data:$PGDATA
    healthcheck:
      test: ["CMD", "/usr/local/bin/psql_healthcheck.sh"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  # in memory database
  # because it does not support env or secrets
  # i have used shell to get secret password and REDIS_PORT env
  redis:
    container_name: redis
    build: ./devops/redis/
    # ports:
    #   - ${REDIS_PORT}:${REDIS_PORT}
    environment:
      - REDIS_PORT
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
    secrets:
      - redis_password

  mail_server:
    container_name: mail_server
    image: axllent/mailpit
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:8025/readyz"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      - 8025:8025
      - 1025:1025


  nginx_exporter:
    container_name: nginx_prometheus_exporter
    image: nginx/nginx-prometheus-exporter:1.5.3
    command:
      - "--nginx.scrape-uri=${NGINX_STUB_STATUS_SCHEME}://nginx:${NGINX_STUB_STATUS_PORT}/${NGINX_STUB_STATUS}"
      - "--web.listen-address=:${NGINX_EXPORTER_PORT}"
    environment:
      NGINX_STUB_STATUS_SCHEME: "${NGINX_STUB_STATUS_SCHEME:?NGINX_STUB_STATUS_SCHEME is required}"
      NGINX_STUB_STATUS_PORT: "${NGINX_STUB_STATUS_PORT:?NGINX_STUB_STATUS_PORT is required}"
      NGINX_STUB_STATUS: "${NGINX_STUB_STATUS:?NGINX_STUB_STATUS is required}"
      NGINX_EXPORTER_PORT: "${NGINX_EXPORTER_PORT:?NGINX_EXPORTER_PORT is required}"
    ports:
      - ${NGINX_EXPORTER_PORT}:${NGINX_EXPORTER_PORT}
    depends_on:
      nginx:
        condition: service_healthy

  redis_exporter:
    container_name: redis_exporter
    image: oliver006/redis_exporter
    command:
      - -redis.password-file=/run/secrets/redis_exporter.json
      - -redis.addr=redis:$REDIS_PORT
      - -check-keys=db0=names,users
      - -basic-auth-username=hamza
      - -basic-auth-password=9999
    secrets:
      - source: redis_exporter_password
        target: /run/secrets/redis_exporter.json
    ports:
      - 9121:9121

  postgres-exporter:
    container_name: postgres-exporter
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1 
    command:
      - --datasource.pass-file=/run/secrets/postgres_password
      - --datasource.user-file=/run/secrets/postgres_user
      - --datasource.uri=postgresql:${POSTGRES_PORT}/postgres?sslmode=disable
      - --web.listen-address=:${POSTGRES_EXPORTER_PORT}
      - --web.config.file=/etc/postgres-exporter/config.yml
      - --web.telemetry-path=/metrics
    secrets:
      - postgres_password
      - postgres_user
    volumes:
      - ./devops/postgres-exporter/configs/config.yml:/etc/postgres-exporter/config.yml
    ports:
      - $POSTGRES_EXPORTER_PORT:$POSTGRES_EXPORTER_PORT

  # this is: Prometheus exporter for hardware and OS metrics exposed by *NIX kernels
  # not nodejs exporter!!
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.13.1-distroless
    volumes:
      - '/:/host:ro,rslave'
    command:
      - --path.rootfs=/host

  prometheus:
    container_name: prometheus
    build: ./devops/prometheus/
    environment:
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:?PROMETHEUS_PORT is required}"
    volumes:
      - ./devops/prometheus/scrapes.d/:/etc/prometheus/scrapes.d/
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --web.listen-address=:${PROMETHEUS_PORT}
    ports:
      - ${PROMETHEUS_PORT}:${PROMETHEUS_PORT}
  # grafana:
  #   container_name: grafana
  #   image: grafana:13.1-slim
  #   environment:
  #     ;

  alertmanager:
    image: prom/alertmanager:v0.35.0-distroless
    container_name: alertmanager
    command:
      - --web.listen-address=:${ALERTMANGER_PORT}
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - ${ALERTMANGER_PORT}:${ALERTMANGER_PORT}

  grafana:
    container_name: grafana
    build: ./devops/grafana/ 
    environment:
      # rule: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#override-configuration-with-environment-variables
      # PATH
      GF_PATH_LOGS: "${GF_PATH_LOGS:?}"
      GF_PATH_PROVISIONING: "${GF_PATH_PROVISIONING:?}"
      # SECURITY
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:?}"
      # SERVER
      GF_SERVER_HTTP_PORT: "${GF_SERVER_HTTP_PORT:?}"
      PROMETHEUS_PORT: "${PROMETHEUS_PORT}"
    ports:
      - "$GF_SERVER_HTTP_PORT:$GF_SERVER_HTTP_PORT"
      
    volumes: 
      - ./devops/grafana/configs/grafana.ini:/etc/grafana/grafana.ini
      - ./devops/grafana/configs/provisioning/:/etc/grafana/provisioning/
    secrets:
      - grafana_password
      - prometheus_password

secrets:
  postgres_password:
    file: ./secrets/postgresql/postgres_password
  postgres_user:
    file: ./secrets/postgresql/postgres_user
  suf_user:
    file: ./secrets/postgresql/suf/suf_user
  suf_password:
    file: ./secrets/postgresql/suf/suf_password
  redis_password:
    file: ./secrets/redis/redis_password
  redis_exporter_password:
    file: ./secrets/redis_exporter/redis_exporter.json
  grafana_password:
    file: ./secrets/grafana/grafana_password
  prometheus_password:
    file: ./secrets/prometheus/prometheus_password

volumes:
  db_data:
    driver: local
    driver_opts:
      device: /tmp/dir
