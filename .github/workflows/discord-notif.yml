name: Discord Notification

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Send Discord notification
        env:
          # DISCORD_HOOK: ${{ secrets.DISCORD_HOOK }}
          # BACKEND_HOOK: ${{ secrets.BACKEND_HOOK }}
          FRONTEND_HOOK: ${{ secrets.FRONTEND_HOOK }}
          BACKEND_HOOK: ${{ secrets.BACKEND_HOOK }}
          DATABASE_HOOK: ${{ secrets.DATABASE_HOOK }}
          DEVOPS_HOOK: ${{ secrets.DEVOPS_HOOK }}

          REPO: ${{ github.repository }}
          COMMIT:  ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BRANCH: ${{ github.head_ref || github.ref_name }} 
        # script to send commit info to discord pased on BRANCH
        run: ./devops/automation/tools/github.sh
