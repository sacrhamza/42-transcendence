services:
  # NOTE: our object server
  minio:
    container_name: minio
    build:
      context: ./minio/
    volumes:
      - ./minio/configs/:/minio/:ro
      - minio_volume:/mnt/data/
      - ./prometheus/scrapes.d/minio_prometheus.yml:/scrapes.d/minio_prometheus.yml
      # NOTE: that address is for api, and console-address is for webui primary
    command: minio server /mnt/data --license /minio/minio.license --address=:$MINIO_API_PORT --console-address=:$MINIO_WEBUI_PORT
    secrets:
      - minio_user
      - minio_pass
    environment:
      MINIO_API_PORT: ${MINIO_API_PORT:?MINIO_API_PORT is required}
      MINIO_WEBUI_PORT: ${MINIO_WEBUI_PORT:?MINIO_WEBUI_PORT is required}
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_pass
    ports:
      - 127.0.0.1:${MINIO_WEBUI_PORT}:${MINIO_WEBUI_PORT}
      - 127.0.0.1:${MINIO_API_PORT}:${MINIO_API_PORT}
      # TODO: add healthcheck and for that check: https://docs.min.io/aistor/reference/cli/mc-ready/ https://stackoverflow.com/questions/66412289/minio-add-a-public-bucket-with-docker-compose
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 1s
      timeout: 5s
      retries: 5
  
  prometheus:
    container_name: prometheus
    build: ./prometheus/
    command:   --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.config.file=/etc/prometheus/web.yml --web.listen-address=:${PROMETHEUS_PORT:?PROMETHEUS_PORT is required}
    volumes:
      - ./prometheus/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/scrapes.d/minio_prometheus.yml:/etc/prometheus/scrapes.d/minio_prometheus.yml:ro
      - ./prometheus/templates/:/etc/prometheus/templates/:ro
      - ./prometheus/ssl/:/etc/prometheus/ssl/
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT}:${PROMETHEUS_PORT}
    depends_on:
      minio:
        condition: service_healthy
    configs:
      - source: prometeus_web
        target: /etc/prometheus/web.yml
    environment:
      NGINX_EXPORTER: "${NGINX_EXPORTER:?NGINX_EXPORTER is required}"

  nginx_prometheus_exporter:
    container_name: nginx_prometheus_exporter
    command: --web.listen-address=:${NGINX_EXPORTER?NGINX_EXPORTER:?is required for nginx_prometheus_exporter command}
    build: ./nginx-prometheus-exporter
    environment:
      NGINX_STUB_STATUS_SCHEME: "${NGINX_STUB_STATUS_SCHEME:?NGINX_STUB_STATUS_SCHEME IS REQUIRED}"
      NGINX_ADDR: "${NGINX_ADDR:?NGINX_ADDR IS REQUIRED}"
      NGINX_STUB_STATUS_PORT: "${NGINX_STUB_STATUS_PORT:?NGINX_STUB_STATUS_PORT IS REQUIRED}"
      NGINX_STUB_STATUS: "${NGINX_STUB_STATUS:?NGINX_STUB_STATUS IS REQUIRED}"
    ports:
      - 127.0.0.1:${NGINX_EXPORTER}:${NGINX_EXPORTER}
    # depends_on:
    #   nginx:
    #     condition: service_healthy

  nginx:
    container_name: nginx
    build: ./nginx/
    environment:
      NGINX_STUB_STATUS_SCHEME: "${NGINX_STUB_STATUS_SCHEME:?NGINX_STUB_STATUS_SCHEME IS REQUIRED}"
      NGINX_ADDR: "${NGINX_ADDR:?NGINX_ADDR IS REQUIRED}"
      NGINX_STUB_STATUS_PORT: "${NGINX_STUB_STATUS_PORT:?NGINX_STUB_STATUS_PORT IS REQUIRED}"
      NGINX_STUB_STATUS: "${NGINX_STUB_STATUS:?NGINX_STUB_STATUS IS REQUIRED}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - ${NGINX_STUB_STATUS_PORT}:${NGINX_STUB_STATUS_PORT}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 4s
      timeout: 3s
      retries: 5

volumes:
  minio_volume:
    driver: local
    driver_opts:
      device: ./minio/minio_data/
      type: none
      o: bind
  prometeus_volume:
    driver: local
    driver_opts:
      device: ./prometheus/prometheus_data

configs:
  prometeus_web:
    # here use file and use secret with compose
    content: |
      tls_server_config:
        cert_file: /etc/prometheus/ssl/certificate.pem 
        key_file: /etc/prometheus/ssl/server.key
      basic_auth_users:
        admin: ${PASS_HASH} 

secrets:
  minio_user:
    file: ./minio/creds/user
  minio_pass:
    file: ./minio/creds/password

